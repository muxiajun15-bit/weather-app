<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1a1a2e">
  <title>天気予報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.25);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.25);
      --blur: blur(16px);
      --text: #fff;
      --text-dim: rgba(255,255,255,0.7);
      --accent: rgba(255,255,255,0.2);
      --radius: 20px;
      --font: 'Inter', system-ui, sans-serif;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Background ── */
    body {
      font-family: var(--font);
      min-height: 100svh;
      background: #1a1a2e;
      color: var(--text);
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      transition: background 2s ease;
      background-size: cover;
      background-position: center;
      background-blend-mode: multiply;
    }
    #bg-canvas::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.44)),
        radial-gradient(circle at 50% 12%, rgba(255,255,255,0.18), transparent 34%);
      pointer-events: none;
    }

    /* ── Layout ── */
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header h1 {
      font-family: 'Mochiy Pop One', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
    }
    .header-actions { display: flex; gap: 8px; }

    /* ── Glass Card ── */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
    }

    /* ── Search Box ── */
    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      align-items: center;
    }
    .search-icon { font-size: 1.2rem; opacity: 0.7; flex-shrink: 0; }
    #cityInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 1.1rem;
      color: var(--text);
      font-family: var(--font);
    }
    #cityInput::placeholder { color: var(--text-dim); }
    #searchBtn {
      background: rgba(255,255,255,0.22);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: background var(--transition);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #searchBtn:hover { background: rgba(255,255,255,0.32); }
    #searchBtn .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    #searchBtn.loading .btn-label { display: none; }
    #searchBtn.loading .spinner { display: block; }

    /* History Dropdown */
    .history-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      z-index: 100;
      overflow: hidden;
      border-radius: 16px;
    }
    .history-dropdown.open { display: block; }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .history-clear-btn {
      background: none; border: none; color: var(--text-dim);
      font-size: 0.78rem; cursor: pointer; padding: 2px 4px;
      font-family: var(--font);
    }
    .history-clear-btn:hover { color: var(--text); }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }
    .history-item:hover { background: rgba(255,255,255,0.1); }
    .history-item-left { display: flex; align-items: center; gap: 8px; }
    .history-del {
      background: none; border: none; color: var(--text-dim);
      font-size: 0.9rem; cursor: pointer; padding: 2px 6px;
      line-height: 1;
    }
    .history-del:hover { color: #ff6b6b; }

    /* City suggestions */
    .suggestions-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      z-index: 110;
      overflow: hidden;
      border-radius: 16px;
    }
    .suggestions-dropdown.open { display: block; }
    .suggestion-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: none;
      border: none;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .suggestion-item:hover,
    .suggestion-item:focus-visible { background: rgba(255,255,255,0.12); outline: none; }
    .suggestion-meta { color: var(--text-dim); font-size: 0.82rem; margin-left: auto; }

    /* ── Unit / Dark toggle ── */
    .icon-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text);
      width: 38px; height: 38px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: var(--font);
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Geo Button ── */
    #geoBtn {
      background: none; border: none; color: var(--text-dim);
      font-size: 1.2rem; cursor: pointer; padding: 4px;
      flex-shrink: 0; transition: color 0.2s;
    }
    #geoBtn:hover { color: var(--text); }

    /* ── Favorites strip ── */
    .favorites-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      min-height: 0;
    }
    .fav-chip {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background var(--transition);
      font-family: var(--font);
    }
    .fav-chip:hover { background: rgba(255,255,255,0.22); }
    .fav-chip-del { opacity: 0.5; font-size: 0.75rem; cursor: pointer; }
    .fav-chip-del:hover { opacity: 1; color: #ff6b6b; }

    /* ── Favorite comparison ── */
    #compareCard {
      padding: 16px 0 16px 16px;
      margin-bottom: 16px;
      display: none;
      animation: fadeUp 0.5s ease both;
    }
    .compare-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-right: 16px;
      scrollbar-width: none;
    }
    .compare-scroll::-webkit-scrollbar { display: none; }
    .compare-card {
      min-width: 128px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .compare-card:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.18); }
    .compare-city { font-size: 0.86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .compare-temp { font-size: 1.45rem; font-weight: 700; margin: 6px 0 2px; }
    .compare-desc { font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Current Weather Card ── */
    #weatherCard {
      padding: 28px 24px 24px;
      margin-bottom: 16px;
      animation: fadeUp 0.5s ease both;
      display: none;
    }

    .weather-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .city-info h2 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .city-info .country-time {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .fav-toggle {
      background: none; border: none; color: var(--text-dim);
      font-size: 1.5rem; cursor: pointer; padding: 4px;
      transition: color 0.2s, transform 0.2s;
      line-height: 1;
    }
    .fav-toggle:hover { transform: scale(1.2); }
    .fav-toggle.active { color: #ff6b6b; }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .weather-icon-wrap { position: relative; }
    .weather-icon-wrap img {
      width: 90px; height: 90px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    .temp-big {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .temp-unit { font-size: 2rem; font-weight: 300; opacity: 0.8; }
    .weather-desc-col {
      margin-left: auto;
      text-align: right;
    }
    .weather-desc { font-size: 1rem; color: var(--text-dim); margin-bottom: 6px; }
    .feels-like { font-size: 0.85rem; color: var(--text-dim); }
    .hi-lo { font-size: 0.9rem; margin-top: 4px; }
    .hi-lo span { font-weight: 500; }

    /* Details grid */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .detail-item {
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .detail-label { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 0.04em; }
    .detail-value { font-size: 1.05rem; font-weight: 600; }
    .detail-icon { font-size: 1.2rem; margin-bottom: 2px; }

    /* AQI badge */
    .aqi-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Sun row */
    .sun-row {
      display: flex;
      justify-content: space-around;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .sun-item { text-align: center; }
    .sun-label { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 4px; }
    .sun-value { font-size: 0.95rem; font-weight: 500; }

    /* ── Smart insights ── */
    #insightCard {
      padding: 20px 24px;
      margin-bottom: 16px;
      display: none;
      animation: fadeUp 0.5s 0.05s ease both;
    }
    .insight-layout {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 18px;
      align-items: center;
    }
    .comfort-meter {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--meter-color, #65d6ad) var(--score-pct, 70%), rgba(255,255,255,0.14) 0);
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
    }
    .comfort-meter::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: rgba(0,0,0,0.26);
      backdrop-filter: blur(8px);
    }
    .comfort-score {
      position: relative;
      font-weight: 700;
      font-size: 1.4rem;
    }
    .comfort-label {
      position: relative;
      margin-top: 2px;
      font-size: 0.68rem;
      color: var(--text-dim);
      text-align: center;
    }
    .insight-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .insight-message {
      color: var(--text-dim);
      line-height: 1.55;
      font-size: 0.9rem;
    }
    .advice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .advice-item {
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      min-height: 78px;
    }
    .advice-icon { font-size: 1.2rem; margin-bottom: 6px; }
    .advice-label { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 3px; }
    .advice-text { font-size: 0.88rem; font-weight: 600; line-height: 1.35; }

    /* ── Rain timeline ── */
    #rainCard {
      padding: 20px 20px 18px;
      margin-bottom: 16px;
      display: none;
      animation: fadeUp 0.5s 0.12s ease both;
    }
    .rain-summary {
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .rain-bars {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
      min-height: 118px;
    }
    .rain-slot {
      min-width: 0;
      display: grid;
      grid-template-rows: 22px 72px 18px;
      gap: 5px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.68rem;
    }
    .rain-bar-track {
      height: 72px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: end;
      overflow: hidden;
    }
    .rain-bar-fill {
      width: 100%;
      min-height: 3px;
      border-radius: 10px;
      background: linear-gradient(180deg, #9bd8ff, #3c9bd9);
    }
    .rain-pop { color: #9bd8ff; font-weight: 600; }

    /* ── Hourly Forecast ── */
    #hourlyCard {
      padding: 20px 0 20px 20px;
      margin-bottom: 16px;
      display: none;
      animation: fadeUp 0.5s 0.1s ease both;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 14px;
      padding-right: 20px;
    }
    .hourly-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      padding-right: 20px;
      scrollbar-width: none;
    }
    .hourly-scroll::-webkit-scrollbar { display: none; }
    .hourly-item {
      flex-shrink: 0;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 68px;
    }
    .hourly-item.now { background: rgba(255,255,255,0.2); }
    .hourly-time { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
    .hourly-icon { font-size: 1.5rem; margin-bottom: 4px; }
    .hourly-temp { font-size: 0.95rem; font-weight: 600; }
    .hourly-pop { font-size: 0.72rem; color: #7ec8e3; margin-top: 2px; }

    /* ── 5-Day Forecast ── */
    #forecastCard {
      padding: 20px 24px;
      margin-bottom: 16px;
      display: none;
      animation: fadeUp 0.5s 0.2s ease both;
    }
    .forecast-list { display: flex; flex-direction: column; gap: 4px; }
    .forecast-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .forecast-row:last-child { border-bottom: none; }
    .forecast-day { width: 72px; font-size: 0.9rem; font-weight: 500; }
    .forecast-icon { font-size: 1.4rem; width: 40px; text-align: center; }
    .forecast-desc { flex: 1; font-size: 0.82rem; color: var(--text-dim); }
    .forecast-pop { font-size: 0.8rem; color: #7ec8e3; width: 40px; text-align: right; }
    .forecast-temps { display: flex; gap: 8px; font-size: 0.9rem; min-width: 80px; justify-content: flex-end; }
    .forecast-hi { font-weight: 600; }
    .forecast-lo { color: var(--text-dim); }
    .forecast-range {
      width: 62px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      margin-left: 4px;
    }
    .forecast-range span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6ec8ff, #ffd166);
    }

    /* ── Status / Error ── */
    #statusMsg {
      text-align: center;
      padding: 40px 20px;
      font-size: 1rem;
      color: var(--text-dim);
      display: none;
    }
    #statusMsg.error { color: #ff8a8a; }
    #statusMsg.visible { display: block; }

    /* ── Last Updated ── */
    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* ── Animations ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* ── Dark Mode (light override) ── */
    body.light {
      --glass-bg: rgba(0,0,0,0.07);
      --glass-border: rgba(0,0,0,0.12);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.12);
      --text: #1a1a2e;
      --text-dim: rgba(0,0,0,0.5);
      --accent: rgba(0,0,0,0.1);
      background: #e8edf5;
    }
    body.light #bg-canvas { opacity: 0.4; }
    body.light .comfort-meter::before { background: rgba(255,255,255,0.56); }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .temp-big { font-size: 4rem; }
      .details-grid { grid-template-columns: repeat(2, 1fr); }
      .insight-layout { grid-template-columns: 1fr; }
      .comfort-meter { margin: 0 auto; }
      .advice-grid { grid-template-columns: 1fr; }
      .rain-bars { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 12px; }
      .forecast-range { display: none; }
    }
  </style>
</head>
<body>
  <div id="bg-canvas"></div>

  <div class="app">
    <!-- Header -->
    <div class="header">
      <h1>☁ 天気予報</h1>
      <div class="header-actions">
        <button class="icon-btn" id="unitToggle" title="°C / °F 切り替え" aria-label="単位切り替え">°C</button>
        <button class="icon-btn" id="themeToggle" title="ダーク/ライト切り替え" aria-label="テーマ切り替え">🌙</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <div class="glass search-row">
        <span class="search-icon">🔍</span>
        <input id="cityInput" type="text" placeholder="都市名を入力（例: Tokyo, London）"
          autocomplete="off" aria-label="都市名" />
        <button id="geoBtn" title="現在地を使用" aria-label="現在地を使用">📍</button>
        <button id="searchBtn" aria-label="検索">
          <span class="btn-label">検索</span>
          <div class="spinner" aria-hidden="true"></div>
        </button>
      </div>
      <div class="history-dropdown glass" id="historyDropdown" role="listbox" aria-label="検索履歴">
        <div class="history-header">
          <span>最近の検索</span>
          <button class="history-clear-btn" id="clearHistoryBtn">すべて削除</button>
        </div>
        <div id="historyList"></div>
      </div>
      <div class="suggestions-dropdown glass" id="suggestionsDropdown" role="listbox" aria-label="都市候補"></div>
    </div>

    <!-- Favorites -->
    <div class="favorites-strip" id="favStrip"></div>

    <!-- Favorite Compare -->
    <div class="glass" id="compareCard" aria-label="お気に入り都市の比較">
      <div class="section-title">FAVORITE CITIES</div>
      <div class="compare-scroll" id="compareScroll"></div>
    </div>

    <!-- Status / Error -->
    <div id="statusMsg" role="alert" aria-live="polite"></div>

    <!-- Current Weather -->
    <div class="glass" id="weatherCard" role="main" aria-label="現在の天気">
      <div class="weather-top">
        <div class="city-info">
          <h2 id="cityName">—</h2>
          <div class="country-time" id="countryTime">—</div>
        </div>
        <button class="fav-toggle" id="favToggle" aria-label="お気に入り登録">♡</button>
      </div>
      <div class="weather-main">
        <div class="weather-icon-wrap">
          <img id="weatherIcon" src="" alt="" width="90" height="90" />
        </div>
        <div>
          <div class="temp-big"><span id="tempVal">—</span><span class="temp-unit" id="tempUnitLabel">°C</span></div>
          <div class="feels-like" id="feelsLike"></div>
          <div class="hi-lo" id="hiLo"></div>
        </div>
        <div class="weather-desc-col">
          <div class="weather-desc" id="weatherDesc">—</div>
          <div id="aqiBadge"></div>
        </div>
      </div>
      <div class="details-grid" id="detailsGrid"></div>
      <div class="sun-row" id="sunRow"></div>
    </div>

    <!-- Smart Insights -->
    <div class="glass" id="insightCard" aria-label="今日のコンディション">
      <div class="section-title">TODAY'S GUIDE</div>
      <div id="insightContent"></div>
    </div>

    <!-- Rain Timeline -->
    <div class="glass" id="rainCard" aria-label="降水タイムライン">
      <div class="section-title">RAIN TIMELINE</div>
      <div class="rain-summary" id="rainSummary"></div>
      <div class="rain-bars" id="rainBars"></div>
    </div>

    <!-- Hourly -->
    <div class="glass" id="hourlyCard" aria-label="時間別予報">
      <div class="section-title">HOURLY FORECAST</div>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </div>

    <!-- 5-Day Forecast -->
    <div class="glass" id="forecastCard" aria-label="5日間予報">
      <div class="section-title">5-DAY FORECAST</div>
      <div class="forecast-list" id="forecastList"></div>
    </div>

    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <script>
  (() => {
    const API_KEY = "f328bb94d6e22a03193bafc0d33043da";

    // ── State ──
    let useFahrenheit = false;
    let currentData = null;      // raw API data for unit conversion
    let currentCity = "";
    let currentLat = null, currentLon = null;
    let refreshTimer = null;
    let lastFetchTime = null;
    let suggestionTimer = null;
    let compareRequestId = 0;

    const MAX_HISTORY = 10;
    const MAX_COMPARE = 6;
    const SNAPSHOT_KEY = "wx_last_snapshot";

    // ── DOM refs ──
    const cityInput   = document.getElementById("cityInput");
    const searchBtn   = document.getElementById("searchBtn");
    const geoBtn      = document.getElementById("geoBtn");
    const unitToggle  = document.getElementById("unitToggle");
    const themeToggle = document.getElementById("themeToggle");
    const historyDrop = document.getElementById("historyDropdown");
    const suggestionsDrop = document.getElementById("suggestionsDropdown");
    const historyList = document.getElementById("historyList");
    const clearHistBtn= document.getElementById("clearHistoryBtn");
    const favStrip    = document.getElementById("favStrip");
    const compareCard = document.getElementById("compareCard");
    const compareScroll = document.getElementById("compareScroll");
    const favToggle   = document.getElementById("favToggle");
    const statusMsg   = document.getElementById("statusMsg");
    const weatherCard = document.getElementById("weatherCard");
    const insightCard = document.getElementById("insightCard");
    const insightContent = document.getElementById("insightContent");
    const rainCard    = document.getElementById("rainCard");
    const rainSummary = document.getElementById("rainSummary");
    const rainBars    = document.getElementById("rainBars");
    const hourlyCard  = document.getElementById("hourlyCard");
    const forecastCard= document.getElementById("forecastCard");
    const lastUpdatedEl = document.getElementById("lastUpdated");

    // ── LocalStorage helpers ──
    const getHistory  = () => JSON.parse(localStorage.getItem("wx_history") || "[]");
    const getFavs     = () => JSON.parse(localStorage.getItem("wx_favs") || "[]");
    const isDark      = () => localStorage.getItem("wx_dark") !== "light";
    const escapeHtml  = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));

    function saveHistory(city) {
      let h = getHistory().filter(c => c.toLowerCase() !== city.toLowerCase());
      h.unshift(city);
      if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
      localStorage.setItem("wx_history", JSON.stringify(h));
      renderHistory();
    }
    function deleteHistory(city) {
      const h = getHistory().filter(c => c.toLowerCase() !== city.toLowerCase());
      localStorage.setItem("wx_history", JSON.stringify(h));
      renderHistory();
    }
    function toggleFav(city) {
      let favs = getFavs();
      const idx = favs.findIndex(c => c.toLowerCase() === city.toLowerCase());
      if (idx >= 0) favs.splice(idx, 1); else favs.unshift(city);
      localStorage.setItem("wx_favs", JSON.stringify(favs));
      renderFavs();
      updateFavBtn();
    }
    function isFav(city) {
      return getFavs().some(c => c.toLowerCase() === city.toLowerCase());
    }

    // ── Unit conversion ──
    const toDisplay = c => useFahrenheit ? Math.round(c * 9/5 + 32) : Math.round(c);
    const unitStr   = () => useFahrenheit ? "°F" : "°C";

    // ── Background gradients ──
    const BG_MAP = {
      clear_day:   "linear-gradient(160deg,rgba(30,60,114,.72),rgba(247,151,30,.42)), url('./bg1.jpg')",
      clear_night: "linear-gradient(160deg,rgba(15,12,41,.82),rgba(36,36,62,.7)), url('./bg1.jpg')",
      clouds_day:  "linear-gradient(160deg,rgba(58,74,92,.72),rgba(140,166,184,.52)), url('./bg2.jpg')",
      clouds_night:"linear-gradient(160deg,rgba(20,26,44,.84),rgba(15,52,96,.66)), url('./bg2.jpg')",
      rain_day:    "linear-gradient(160deg,rgba(30,60,110,.64),rgba(45,106,159,.62)), url('./bg3.jpg')",
      rain_night:  "linear-gradient(160deg,rgba(13,13,26,.84),rgba(13,36,68,.7)), url('./bg3.jpg')",
      snow_day:    "linear-gradient(160deg,rgba(106,159,181,.52),rgba(205,227,236,.36)), url('./bg4.jpg')",
      snow_night:  "linear-gradient(160deg,rgba(26,42,58,.7),rgba(58,74,90,.54)), url('./bg4.jpg')",
      thunder_day: "linear-gradient(160deg,rgba(26,26,46,.78),rgba(106,32,112,.56)), url('./bg2.jpg')",
      thunder_night:"linear-gradient(160deg,rgba(10,10,26,.86),rgba(42,10,48,.72)), url('./bg2.jpg')",
      mist_day:    "linear-gradient(160deg,rgba(83,105,118,.7),rgba(138,163,174,.48)), url('./bg2.jpg')",
      mist_night:  "linear-gradient(160deg,rgba(26,32,48,.82),rgba(58,64,80,.64)), url('./bg2.jpg')",
      default:     "linear-gradient(160deg,rgba(26,26,46,.74),rgba(15,52,96,.6)), url('./bg1.jpg')",
    };

    function setBackground(weatherId, icon) {
      const isNight = icon && icon.endsWith("n");
      const suffix  = isNight ? "_night" : "_day";
      let key;
      if (weatherId >= 200 && weatherId < 300) key = "thunder";
      else if (weatherId >= 300 && weatherId < 600) key = "rain";
      else if (weatherId >= 600 && weatherId < 700) key = "snow";
      else if (weatherId >= 700 && weatherId < 800) key = "mist";
      else if (weatherId === 800) key = "clear";
      else if (weatherId > 800) key = "clouds";
      else key = "default";
      document.getElementById("bg-canvas").style.background =
        BG_MAP[key + suffix] || BG_MAP["default"];
    }

    // ── Weather icon emoji (fallback supplement) ──
    function iconEmoji(id, icon) {
      const n = icon && icon.endsWith("n");
      if (id === 800) return n ? "🌙" : "☀️";
      if (id > 800)  return n ? "☁️" : "⛅";
      if (id >= 700) return "🌫️";
      if (id >= 600) return "❄️";
      if (id >= 500) return "🌧️";
      if (id >= 300) return "🌦️";
      if (id >= 200) return "⛈️";
      return "🌡️";
    }

    // ── Wind direction ──
    function windDir(deg) {
      const dirs = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
                    "南","南南西","南西","西南西","西","西北西","北西","北北西"];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    // ── AQI ──
    const AQI_LABELS = ["—","良好","まずまず","やや悪い","悪い","非常に悪い"];
    const AQI_COLORS = ["","#4caf50","#8bc34a","#ff9800","#f44336","#9c27b0"];

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function rainChance(item) {
      const id = item.weather?.[0]?.id || 800;
      const pop = item.pop ? item.pop : 0;
      if (id >= 200 && id < 700) return Math.max(pop, 0.55);
      return pop;
    }

    function summarizeRain(items) {
      const next12 = items.filter(i => i.dt > Date.now() / 1000).slice(0, 8);
      const wet = next12.find(i => rainChance(i) >= 0.35);
      if (!wet) return "この先しばらく強い雨のサインは低めです。";
      const time = new Date(wet.dt * 1000).toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
      const pop = Math.round(rainChance(wet) * 100);
      const desc = wet.weather?.[0]?.description || "雨";
      return `${time}ごろに${desc}の可能性があります。降水確率は約${pop}%です。`;
    }

    function buildWeatherGuide(w, forecastItems, aqi) {
      const now = Date.now() / 1000;
      const next = forecastItems.filter(i => i.dt > now).slice(0, 8);
      const temps = next.length ? next.map(i => i.main.temp) : [w.main.temp];
      const maxTemp = Math.max(...temps, w.main.temp);
      const minTemp = Math.min(...temps, w.main.temp);
      const maxRain = next.length ? Math.max(...next.map(rainChance)) : 0;
      const windKmh = w.wind ? Math.round(w.wind.speed * 3.6) : 0;
      const aqiIdx = aqi?.list?.[0]?.main?.aqi || 0;

      let score = 100;
      score -= Math.abs(w.main.feels_like - 22) * 1.7;
      score -= maxRain * 26;
      score -= Math.max(0, windKmh - 18) * 0.9;
      score -= Math.max(0, aqiIdx - 2) * 10;
      score = clamp(Math.round(score), 28, 98);

      const alerts = [];
      if (maxRain >= 0.65) alerts.push("傘を持って出ると安心です。");
      else if (maxRain >= 0.35) alerts.push("折りたたみ傘があると身軽です。");
      if (minTemp <= 8) alerts.push("朝晩はかなり冷えます。");
      else if (maxTemp >= 30) alerts.push("暑さ対策と水分補給を優先しましょう。");
      if (windKmh >= 32) alerts.push("風が強めなので移動時は注意。");
      if (aqiIdx >= 4) alerts.push("空気が重めです。長時間の屋外活動は控えめに。");

      const outfit = w.main.feels_like <= 8 ? "厚手の上着" :
        w.main.feels_like <= 16 ? "軽い羽織り" :
        w.main.feels_like >= 28 ? "通気性重視" : "身軽な服装";
      const umbrella = maxRain >= 0.35 ? "傘を携帯" : "傘なしでOK";
      const outdoor = aqiIdx >= 4 ? "短めの外出" : windKmh >= 32 ? "風に注意" : score >= 75 ? "散歩日和" : "無理なく行動";

      return {
        score,
        meterColor: score >= 78 ? "#65d6ad" : score >= 58 ? "#ffd166" : "#ff8a8a",
        title: alerts.length ? "少し気をつけたい天気です" : "過ごしやすいコンディションです",
        message: alerts.length ? alerts.join(" ") : "気温、風、大気質のバランスがよく、外出もしやすい一日です。",
        advice: [
          { icon: "🧥", label: "服装", text: outfit },
          { icon: "☂", label: "持ち物", text: umbrella },
          { icon: "🚶", label: "外出", text: outdoor },
        ],
      };
    }

    function renderInsights(wData, fData, aqiData) {
      const guide = buildWeatherGuide(wData, fData.list, aqiData);
      insightContent.innerHTML = `
        <div class="insight-layout">
          <div class="comfort-meter" style="--score-pct:${guide.score}%;--meter-color:${guide.meterColor}">
            <div>
              <div class="comfort-score">${guide.score}</div>
              <div class="comfort-label">COMFORT</div>
            </div>
          </div>
          <div>
            <div class="insight-title">${escapeHtml(guide.title)}</div>
            <div class="insight-message">${escapeHtml(guide.message)}</div>
          </div>
        </div>
        <div class="advice-grid">
          ${guide.advice.map(item => `
            <div class="advice-item">
              <div class="advice-icon">${item.icon}</div>
              <div class="advice-label">${escapeHtml(item.label)}</div>
              <div class="advice-text">${escapeHtml(item.text)}</div>
            </div>
          `).join("")}
        </div>`;
      insightCard.style.display = "block";
    }

    function renderRainTimeline(items) {
      const next = items.filter(i => i.dt > Date.now() / 1000).slice(0, 8);
      if (!next.length) {
        rainCard.style.display = "none";
        return;
      }
      rainSummary.textContent = summarizeRain(items);
      rainBars.innerHTML = next.map(item => {
        const pop = Math.round(rainChance(item) * 100);
        const time = new Date(item.dt * 1000).toLocaleTimeString("ja-JP", {hour:"2-digit"});
        return `<div class="rain-slot">
          <div class="rain-pop">${pop}%</div>
          <div class="rain-bar-track"><div class="rain-bar-fill" style="height:${clamp(pop, 3, 100)}%"></div></div>
          <div>${time}</div>
        </div>`;
      }).join("");
      rainCard.style.display = "block";
    }

    // ── Render helpers ──
    function showStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.className = (isError ? "error" : "") + " visible";
      weatherCard.style.display = "none";
      insightCard.style.display = "none";
      rainCard.style.display = "none";
      hourlyCard.style.display  = "none";
      forecastCard.style.display= "none";
    }
    function hideStatus() {
      statusMsg.className = "";
    }
    function setLoading(on) {
      searchBtn.classList.toggle("loading", on);
      searchBtn.disabled = on;
    }

    // ── Render current weather ──
    function renderCurrent(w, aqi) {
      const id      = w.weather[0].id;
      const icon    = w.weather[0].icon;
      const desc    = w.weather[0].description;
      const tempC   = w.main.temp;
      const feelsC  = w.main.feels_like;
      const minC    = w.main.temp_min;
      const maxC    = w.main.temp_max;
      const hum     = w.main.humidity;
      const pres    = w.main.pressure;
      const vis     = w.visibility ? (w.visibility / 1000).toFixed(1) + " km" : "—";
      const windSpd = w.wind ? Math.round(w.wind.speed * 3.6) : 0;
      const windDeg = w.wind ? w.wind.deg : 0;
      const sunrise = new Date(w.sys.sunrise * 1000);
      const sunset  = new Date(w.sys.sunset  * 1000);
      const fmt     = d => d.toLocaleTimeString("ja-JP", {hour:"2-digit",minute:"2-digit"});
      const localTime = new Date(Date.now() + w.timezone * 1000 - new Date().getTimezoneOffset()*60000);

      setBackground(id, icon);

      document.getElementById("cityName").textContent   = `${w.name}, ${w.sys.country}`;
      document.getElementById("countryTime").textContent =
        localTime.toLocaleString("ja-JP",{hour:"2-digit",minute:"2-digit",weekday:"short"}) + " 現地時刻";
      document.getElementById("weatherIcon").src = `https://openweathermap.org/img/wn/${icon}@2x.png`;
      document.getElementById("weatherIcon").alt = desc;
      document.getElementById("tempVal").textContent = toDisplay(tempC);
      document.getElementById("tempUnitLabel").textContent = unitStr();
      document.getElementById("weatherDesc").textContent = desc;
      document.getElementById("feelsLike").textContent = `体感 ${toDisplay(feelsC)}${unitStr()}`;
      document.getElementById("hiLo").innerHTML =
        `<span>↑${toDisplay(maxC)}</span> / <span style="color:var(--text-dim)">↓${toDisplay(minC)}</span>${unitStr()}`;

      // Details grid
      document.getElementById("detailsGrid").innerHTML = `
        <div class="detail-item"><div class="detail-icon">💧</div><div class="detail-label">湿度</div><div class="detail-value">${hum}%</div></div>
        <div class="detail-item"><div class="detail-icon">💨</div><div class="detail-label">風速</div><div class="detail-value">${windSpd}km/h</div><div style="font-size:0.72rem;color:var(--text-dim)">${windDir(windDeg)}</div></div>
        <div class="detail-item"><div class="detail-icon">🔵</div><div class="detail-label">気圧</div><div class="detail-value">${pres}hPa</div></div>
        <div class="detail-item"><div class="detail-icon">👁</div><div class="detail-label">視程</div><div class="detail-value">${vis}</div></div>
        <div class="detail-item"><div class="detail-icon">🌡</div><div class="detail-label">体感</div><div class="detail-value">${toDisplay(feelsC)}${unitStr()}</div></div>
        <div class="detail-item" id="aqiDetail"><div class="detail-icon">🌿</div><div class="detail-label">大気質</div><div class="detail-value" id="aqiVal">—</div></div>
      `;
      if (aqi) {
        const idx = aqi.list[0].main.aqi;
        document.getElementById("aqiBadge").innerHTML =
          `<span class="aqi-badge" style="background:${AQI_COLORS[idx]}22;color:${AQI_COLORS[idx]};border:1px solid ${AQI_COLORS[idx]}44">AQI ${AQI_LABELS[idx]}</span>`;
        document.getElementById("aqiVal").innerHTML =
          `<span class="aqi-badge" style="background:${AQI_COLORS[idx]}22;color:${AQI_COLORS[idx]};border:1px solid ${AQI_COLORS[idx]}44">${AQI_LABELS[idx]}</span>`;
      } else {
        document.getElementById("aqiBadge").innerHTML = "";
      }

      // Sun row
      document.getElementById("sunRow").innerHTML = `
        <div class="sun-item"><div class="sun-label">🌅 日の出</div><div class="sun-value">${fmt(sunrise)}</div></div>
        <div class="sun-item"><div class="sun-label">🌇 日の入り</div><div class="sun-value">${fmt(sunset)}</div></div>
      `;

      currentCity = w.name;
      updateFavBtn();

      weatherCard.style.display = "block";
      hideStatus();
    }

    // ── Render hourly ──
    function renderHourly(items) {
      const now = Date.now() / 1000;
      const slice = items.filter(i => i.dt > now).slice(0, 12);
      if (!slice.length) return;
      document.getElementById("hourlyScroll").innerHTML = slice.map((item, idx) => {
        const t    = new Date(item.dt * 1000);
        const time = t.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
        const pop  = item.pop ? Math.round(item.pop * 100) : 0;
        const em   = iconEmoji(item.weather[0].id, item.weather[0].icon);
        return `<div class="hourly-item${idx===0?" now":""}">
          <div class="hourly-time">${time}</div>
          <div class="hourly-icon">${em}</div>
          <div class="hourly-temp">${toDisplay(item.main.temp)}${unitStr()}</div>
          ${pop > 0 ? `<div class="hourly-pop">💧${pop}%</div>` : ""}
        </div>`;
      }).join("");
      hourlyCard.style.display = "block";
    }

    // ── Render 5-day forecast ──
    function renderForecast(items) {
      const days = {};
      const today = new Date().toLocaleDateString("ja-JP");
      items.forEach(item => {
        const d = new Date(item.dt * 1000);
        const key = d.toLocaleDateString("ja-JP");
        if (key === today) return; // skip today
        if (!days[key]) days[key] = { items: [], date: d };
        days[key].items.push(item);
      });

      const rows = Object.values(days).slice(0, 5).map(({ items: its, date }) => {
        const temps = its.map(i => i.main.temp);
        const hi = Math.max(...temps), lo = Math.min(...temps);
        const mid = its[Math.floor(its.length / 2)];
        const id  = mid.weather[0].id;
        const icon= mid.weather[0].icon;
        const pop = Math.max(...its.map(i => i.pop || 0));
        const dayLabel = date.toLocaleDateString("ja-JP",{weekday:"short",month:"numeric",day:"numeric"});
        return `<div class="forecast-row">
          <div class="forecast-day">${dayLabel}</div>
          <div class="forecast-icon">${iconEmoji(id, icon)}</div>
          <div class="forecast-desc">${escapeHtml(mid.weather[0].description)}</div>
          ${pop > 0.05 ? `<div class="forecast-pop">💧${Math.round(pop*100)}%</div>` : '<div class="forecast-pop"></div>'}
          <div class="forecast-temps">
            <span class="forecast-hi">${toDisplay(hi)}°</span>
            <span class="forecast-lo">${toDisplay(lo)}°</span>
          </div>
          <div class="forecast-range"><span style="width:${clamp((hi - lo) * 7 + 24, 24, 100)}%"></span></div>
        </div>`;
      }).join("");

      document.getElementById("forecastList").innerHTML = rows;
      forecastCard.style.display = "block";
    }

    // ── Last updated ──
    function updateLastUpdated() {
      lastFetchTime = Date.now();
      const tick = () => {
        const mins = Math.floor((Date.now() - lastFetchTime) / 60000);
        lastUpdatedEl.textContent = mins < 1 ? "たった今更新" : `${mins}分前に更新`;
      };
      tick();
      clearInterval(window._uptTimer);
      window._uptTimer = setInterval(tick, 30000);
    }

    function saveSnapshot(wData, fData, aqiData) {
      try {
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({
          savedAt: Date.now(),
          weather: wData,
          forecast: fData,
          aqi: aqiData
        }));
      } catch {}
    }

    function restoreSnapshot() {
      try {
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        if (!raw) return false;
        const snapshot = JSON.parse(raw);
        if (!snapshot.weather || !snapshot.forecast) return false;
        currentData = {
          weather: snapshot.weather,
          forecast: snapshot.forecast,
          aqi: snapshot.aqi || null
        };
        currentLat = snapshot.weather.coord?.lat ?? null;
        currentLon = snapshot.weather.coord?.lon ?? null;
        renderAll(snapshot.weather, snapshot.forecast, snapshot.aqi || null, { fromSnapshot: true });
        return true;
      } catch { return false; }
    }

    // ── Fetch all data ──
    async function fetchWeatherByCity(city) {
      setLoading(true);
      showStatus("取得中...");
      try {
        const base = "https://api.openweathermap.org";
        const [wRes, fRes] = await Promise.all([
          fetch(`${base}/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=ja`),
          fetch(`${base}/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=ja&cnt=40`),
        ]);
        if (!wRes.ok) {
          if (wRes.status === 404) throw new Error("その都市が見つかりませんでした。スペルを確認してください。");
          throw new Error("天気情報の取得に失敗しました。時間をおいて再試行してください。");
        }
        if (!fRes.ok) throw new Error("予報データの取得に失敗しました。時間をおいて再試行してください。");
        const [wData, fData] = await Promise.all([wRes.json(), fRes.json()]);
        currentLat  = wData.coord.lat;
        currentLon  = wData.coord.lon;
        const aqiData = await fetchAQI(currentLat, currentLon);
        currentData = { weather: wData, forecast: fData, aqi: aqiData };
        renderAll(wData, fData, aqiData);
        saveHistory(wData.name);
        scheduleAutoRefresh(wData.name, null, null);
      } catch (e) {
        if (!restoreSnapshot()) showStatus(e.message, true);
        else lastUpdatedEl.textContent += " / 最新データの取得に失敗";
      } finally {
        setLoading(false);
      }
    }

    async function fetchWeatherByCoords(lat, lon) {
      setLoading(true);
      showStatus("取得中...");
      try {
        const base = "https://api.openweathermap.org";
        const [wRes, fRes] = await Promise.all([
          fetch(`${base}/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ja`),
          fetch(`${base}/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ja&cnt=40`),
        ]);
        if (!wRes.ok) throw new Error("天気情報の取得に失敗しました。");
        if (!fRes.ok) throw new Error("予報データの取得に失敗しました。");
        const [wData, fData] = await Promise.all([wRes.json(), fRes.json()]);
        currentLat  = lat;
        currentLon  = lon;
        const aqiData = await fetchAQI(lat, lon);
        currentData = { weather: wData, forecast: fData, aqi: aqiData };
        renderAll(wData, fData, aqiData);
        saveHistory(wData.name);
        scheduleAutoRefresh(null, lat, lon);
      } catch (e) {
        if (!restoreSnapshot()) showStatus(e.message, true);
        else lastUpdatedEl.textContent += " / 最新データの取得に失敗";
      } finally {
        setLoading(false);
      }
    }

    async function fetchAQI(lat, lon) {
      try {
        const res = await fetch(
          `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`
        );
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }

    async function fetchCitySuggestions(query) {
      const q = query.trim();
      if (q.length < 2) {
        suggestionsDrop.classList.remove("open");
        suggestionsDrop.innerHTML = "";
        return;
      }
      try {
        const res = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=5&appid=${API_KEY}`);
        if (!res.ok) return;
        const items = await res.json();
        renderSuggestions(items);
      } catch {
        suggestionsDrop.classList.remove("open");
      }
    }

    function renderSuggestions(items) {
      if (!items.length) {
        suggestionsDrop.classList.remove("open");
        suggestionsDrop.innerHTML = "";
        return;
      }
      historyDrop.classList.remove("open");
      suggestionsDrop.innerHTML = items.map(item => {
        const label = [item.local_names?.ja || item.name, item.state, item.country].filter(Boolean).join(", ");
        const meta = item.name !== item.local_names?.ja ? item.name : item.country;
        return `<button class="suggestion-item" type="button"
          data-suggest-name="${escapeHtml(item.name)}"
          data-lat="${item.lat}"
          data-lon="${item.lon}">
          <span>📍</span>
          <span>${escapeHtml(label)}</span>
          <span class="suggestion-meta">${escapeHtml(meta || "")}</span>
        </button>`;
      }).join("");
      suggestionsDrop.classList.add("open");
    }

    function renderAll(wData, fData, aqiData, options = {}) {
      renderCurrent(wData, aqiData);
      renderInsights(wData, fData, aqiData);
      renderRainTimeline(fData.list);
      renderHourly(fData.list);
      renderForecast(fData.list);
      renderFavoriteCompare();
      if (options.fromSnapshot) {
        const savedAt = JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || "{}").savedAt;
        const stamp = savedAt ? new Date(savedAt).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "前回";
        lastUpdatedEl.textContent = `${stamp}の保存データを表示中`;
      } else {
        updateLastUpdated();
        saveSnapshot(wData, fData, aqiData);
      }
    }

    // ── Unit toggle: re-render without refetch ──
    function rerenderUnits() {
      if (!currentData) return;
      const { weather: wData, forecast: fData, aqi: aqiData } = currentData;
      document.getElementById("tempVal").textContent = toDisplay(wData.main.temp);
      document.getElementById("tempUnitLabel").textContent = unitStr();
      document.getElementById("feelsLike").textContent = `体感 ${toDisplay(wData.main.feels_like)}${unitStr()}`;
      document.getElementById("hiLo").innerHTML =
        `<span>↑${toDisplay(wData.main.temp_max)}</span> / <span style="color:var(--text-dim)">↓${toDisplay(wData.main.temp_min)}</span>${unitStr()}`;
      const grid = document.getElementById("detailsGrid");
      if (grid) {
        const feelsEl = grid.querySelector(".detail-item:nth-child(5) .detail-value");
        if (feelsEl) feelsEl.textContent = `${toDisplay(wData.main.feels_like)}${unitStr()}`;
      }
      renderInsights(wData, fData, aqiData);
      renderHourly(fData.list);
      renderForecast(fData.list);
    }

    // ── Auto refresh every 10 min ──
    function scheduleAutoRefresh(city, lat, lon) {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (city) fetchWeatherByCity(city);
        else if (lat != null) fetchWeatherByCoords(lat, lon);
      }, 10 * 60 * 1000);
    }

    // ── History UI ──
    function renderHistory() {
      const h = getHistory();
      if (!h.length) { historyDrop.classList.remove("open"); return; }
      historyList.innerHTML = h.map(c => `
        <div class="history-item" role="option" tabindex="0">
          <div class="history-item-left" data-city="${escapeHtml(c)}">
            <span>🕐</span><span>${escapeHtml(c)}</span>
          </div>
          <button class="history-del" data-del="${escapeHtml(c)}" aria-label="${escapeHtml(c)}を削除">✕</button>
        </div>`).join("");
    }
    renderHistory();

    function showHistory() {
      const h = getHistory();
      if (h.length) historyDrop.classList.add("open");
    }

    // ── Favorites UI ──
    function renderFavs() {
      const favs = getFavs();
      favStrip.innerHTML = favs.map(c => `
        <div class="fav-chip">
          <span data-fav="${escapeHtml(c)}">⭐ ${escapeHtml(c)}</span>
          <span class="fav-chip-del" data-favrm="${escapeHtml(c)}" title="${escapeHtml(c)}を削除">✕</span>
        </div>`).join("");
      renderFavoriteCompare();
    }
    renderFavs();

    async function renderFavoriteCompare() {
      const favs = getFavs().slice(0, MAX_COMPARE);
      const requestId = ++compareRequestId;
      if (!favs.length) {
        compareCard.style.display = "none";
        compareScroll.innerHTML = "";
        return;
      }

      compareCard.style.display = "block";
      compareScroll.innerHTML = favs.map(c => `
        <div class="compare-card" aria-hidden="true">
          <div class="compare-city">${escapeHtml(c)}</div>
          <div class="compare-temp">...</div>
          <div class="compare-desc">取得中</div>
        </div>`).join("");

      const base = "https://api.openweathermap.org";
      const rows = await Promise.all(favs.map(async city => {
        try {
          const res = await fetch(`${base}/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=ja`);
          if (!res.ok) return null;
          return await res.json();
        } catch { return null; }
      }));
      if (requestId !== compareRequestId) return;

      compareScroll.innerHTML = rows.map((w, idx) => {
        const fallbackCity = favs[idx];
        if (!w) {
          return `<div class="compare-card" data-compare="${escapeHtml(fallbackCity)}">
            <div class="compare-city">${escapeHtml(fallbackCity)}</div>
            <div class="compare-temp">--</div>
            <div class="compare-desc">取得できません</div>
          </div>`;
        }
        return `<div class="compare-card" data-compare="${escapeHtml(w.name)}" role="button" tabindex="0">
          <div class="compare-city">${escapeHtml(w.name)}</div>
          <div class="compare-temp">${toDisplay(w.main.temp)}${unitStr()}</div>
          <div class="compare-desc">${iconEmoji(w.weather[0].id, w.weather[0].icon)} ${escapeHtml(w.weather[0].description)}</div>
        </div>`;
      }).join("");
    }

    function updateFavBtn() {
      const f = isFav(currentCity);
      favToggle.textContent = f ? "♥" : "♡";
      favToggle.classList.toggle("active", f);
      favToggle.setAttribute("aria-label", f ? "お気に入りから削除" : "お気に入りに追加");
    }

    // ── Theme ──
    function applyTheme() {
      const dark = isDark();
      document.body.classList.toggle("light", !dark);
      themeToggle.textContent = dark ? "🌙" : "☀️";
    }
    applyTheme();

    // ── Geolocation ──
    function geoLocate() {
      if (!navigator.geolocation) {
        if (!currentData) showStatus("このブラウザでは位置情報が使えません。", true);
        return;
      }
      geoBtn.style.animation = "pulse 1s infinite";
      navigator.geolocation.getCurrentPosition(
        pos => {
          geoBtn.style.animation = "";
          fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude);
        },
        () => {
          geoBtn.style.animation = "";
          fetchWeatherByCity("Tokyo"); // fallback
        },
        { timeout: 8000 }
      );
    }

    // ── Event listeners ──
    searchBtn.addEventListener("click", () => {
      const city = cityInput.value.trim();
      if (!city) { showStatus("都市名を入力してください。", true); return; }
      historyDrop.classList.remove("open");
      suggestionsDrop.classList.remove("open");
      fetchWeatherByCity(city);
    });

    cityInput.addEventListener("keydown", e => {
      if (e.key === "Enter") searchBtn.click();
      if (e.key === "Escape") {
        historyDrop.classList.remove("open");
        suggestionsDrop.classList.remove("open");
      }
    });
    cityInput.addEventListener("focus", showHistory);
    cityInput.addEventListener("input", () => {
      clearTimeout(suggestionTimer);
      suggestionTimer = setTimeout(() => fetchCitySuggestions(cityInput.value), 250);
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) {
        historyDrop.classList.remove("open");
        suggestionsDrop.classList.remove("open");
      }
    });

    historyList.addEventListener("click", e => {
      const city = e.target.closest("[data-city]")?.dataset.city;
      const del  = e.target.closest("[data-del]")?.dataset.del;
      if (del) { e.stopPropagation(); deleteHistory(del); return; }
      if (city) { cityInput.value = city; historyDrop.classList.remove("open"); fetchWeatherByCity(city); }
    });

    suggestionsDrop.addEventListener("click", e => {
      const btn = e.target.closest("[data-lat][data-lon]");
      if (!btn) return;
      cityInput.value = btn.dataset.suggestName || "";
      suggestionsDrop.classList.remove("open");
      fetchWeatherByCoords(Number(btn.dataset.lat), Number(btn.dataset.lon));
    });

    clearHistBtn.addEventListener("click", () => {
      localStorage.removeItem("wx_history");
      historyDrop.classList.remove("open");
      renderHistory();
    });

    favStrip.addEventListener("click", e => {
      const city  = e.target.closest("[data-fav]")?.dataset.fav;
      const favrm = e.target.closest("[data-favrm]")?.dataset.favrm;
      if (favrm) { e.stopPropagation(); toggleFav(favrm); return; }
      if (city)  { cityInput.value = city; fetchWeatherByCity(city); }
    });

    compareScroll.addEventListener("click", e => {
      const city = e.target.closest("[data-compare]")?.dataset.compare;
      if (city) { cityInput.value = city; fetchWeatherByCity(city); }
    });
    compareScroll.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const city = e.target.closest("[data-compare]")?.dataset.compare;
      if (city) {
        e.preventDefault();
        cityInput.value = city;
        fetchWeatherByCity(city);
      }
    });

    favToggle.addEventListener("click", () => {
      if (!currentCity) return;
      toggleFav(currentCity);
    });

    geoBtn.addEventListener("click", geoLocate);

    unitToggle.addEventListener("click", () => {
      useFahrenheit = !useFahrenheit;
      unitToggle.textContent = useFahrenheit ? "°F" : "°C";
      rerenderUnits();
    });

    themeToggle.addEventListener("click", () => {
      const nowDark = isDark();
      localStorage.setItem("wx_dark", nowDark ? "light" : "dark");
      applyTheme();
    });

    // ── PWA ──
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    // ── Init: show the last known weather instantly, then refresh by location ──
    const restored = restoreSnapshot();
    setTimeout(geoLocate, restored ? 350 : 0);
  })();
  </script>
</body>
</html>
